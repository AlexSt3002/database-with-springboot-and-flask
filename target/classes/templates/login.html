<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .login-container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #444;
            transition: color 0.3s ease;
        }

        input[type="text"],
        input[type="password"] {
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.6);
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        .dark-mode {
            background-color: #333;
            color: #f4f4f4;
        }

        .dark-mode .login-container {
            background-color: #444;
            color: #f4f4f4;
        }

        .dark-mode input[type="text"],
        .dark-mode input[type="password"] {
            background-color: #555;
            border-color: #777;
            color: #f4f4f4;
        }

        .dark-mode label {
            color: #ccc;
        }

        p {
            color: red;
            text-align: center;
            font-size: 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            input[type="text"],
            input[type="password"] {
                font-size: 0.9rem;
            }

            button {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>Autentificare</h1>

    <form th:action="@{/medici/login}" method="post">
        <label for="username">Nume utilizator:</label>
        <input type="text" id="username" name="username" required/>
        <br>

        <label for="password">Parolă:</label>
        <input type="password" id="password" name="password" required/>
        <br>

        <button type="submit">Login</button>
    </form>

    <span th:if="${error}" style="color: red;" th:text="${error}"></span>
</div>

<button id="toggle-dark-mode" style="margin-top: 20px; padding: 10px 20px; font-size: 1rem;">Comuta modul intunecat</button>

<script>
    const toggleButton = document.getElementById('toggle-dark-mode');
    toggleButton.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
    });
</script>

</body>
</html>
